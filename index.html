/* Дизайн-план «Мастерская».
   Образ: диагностический стенд автосервиса. Графит, стальная бумага и один сигнальный жёлтый,
   как разметка на полу бокса. Индекс показан шкалой прибора со стрелкой, это главная деталь.
   Шрифты: Geologica (заголовки и цифры), Golos Text (интерфейс).
   Одна система для всех: боковое меню на компьютере, нижние вкладки на телефоне. */
:root {
  --bg: #EEEFEA;
  --paper: #FFFFFF;
  --paper2: #F5F6F2;
  --ink: #16191C;
  --ink2: #565C62;
  --ink3: #8C9196;
  --line: #E2E4DE;
  --teal: #F0BE2A;
  --teal-ink: #6A4E00;
  --teal-soft: #FBF1CF;
  --amber: #D9930B;
  --amber-soft: #FCEFD2;
  --amber-ink: #7A5200;
  --alert: #CC4430;
  --alert-soft: #F9E1DC;
  --good: #2C8A55;
  --good-soft: #DDF0E4;
  --shadow: 0 1px 2px rgba(22,25,28,.05), 0 12px 32px -16px rgba(22,25,28,.18);
  --r: 14px;
  --serif: "Geologica", "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1113;
    --paper: #181B1F;
    --paper2: #1F2328;
    --ink: #ECEDE8;
    --ink2: #A7ACB1;
    --ink3: #73787E;
    --line: #2A2F35;
    --teal: #F2C230;
    --teal-ink: #F2C230;
    --teal-soft: #3A3112;
    --amber: #E9A93A;
    --amber-soft: #392A10;
    --amber-ink: #E9A93A;
    --alert: #EE7563;
    --alert-soft: #3D1F1A;
    --good: #58C287;
    --good-soft: #15322A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1113;
  --paper: #181B1F;
  --paper2: #1F2328;
  --ink: #ECEDE8;
  --ink2: #A7ACB1;
  --ink3: #73787E;
  --line: #2A2F35;
  --teal: #F2C230;
  --teal-ink: #F2C230;
  --teal-soft: #3A3112;
  --amber: #E9A93A;
  --amber-soft: #392A10;
  --amber-ink: #E9A93A;
  --alert: #EE7563;
  --alert-soft: #3D1F1A;
  --good: #58C287;
  --good-soft: #15322A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.num { font-family: var(--serif); font-variant-numeric: tabular-nums lining-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- каркас ---------- */
.app { min-height: 100vh; }
.side { display: none; }
.content { min-width: 0; background: var(--paper); min-height: 100vh; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 56px; padding: 0 16px; padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top-l, .top-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex: none; font-family: var(--serif); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand .mark { width: 22px; height: 22px; padding: 3px; box-sizing: content-box; border-radius: 8px; background: var(--teal); color: #16191C; stroke-width: 2.2; }
.crumb { display: none; color: var(--ink3); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb i { font-style: normal; margin: 0 4px; opacity: .6; }
.crumb b { color: var(--ink); font-weight: 500; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; color: var(--ink2); }
.avatarbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 13px; display: grid; place-items: center; }
.page { padding: 20px 16px calc(96px + env(safe-area-inset-bottom, 0px)); max-width: 1120px; }
.ph { margin-bottom: 22px; }
.ph .eyebrow { margin-bottom: 4px; }
.ph h1 { font-size: 28px; line-height: 1.1; }
.ph .lead { color: var(--ink2); margin-top: 8px; max-width: 62ch; }
.eyebrow { font-size: 13px; color: var(--ink2); }
.h2 { font-size: 18px; margin-bottom: 8px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar button { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; font-size: 11px; color: var(--ink3); min-width: 0; }
.tabbar button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tabbar button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--teal); }

.nav { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; color: var(--ink2); font-weight: 500; text-decoration: none; position: relative; }
.nav:hover { background: var(--paper2); color: var(--ink); }
.nav[aria-current="page"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.nav[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--teal); }
.grp { margin-top: 18px; }
.grp > p { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); padding: 0 12px 6px; }

/* ---------- обзор: шкала индекса ---------- */
.hero { padding-bottom: 6px; }
.hero-top { display: flex; align-items: flex-end; gap: 18px 28px; flex-wrap: wrap; }
.score { display: flex; align-items: baseline; gap: 6px; }
.score .big { font-weight: 700; font-size: 88px; line-height: .82; letter-spacing: -.05em; }
.score .of { font-family: var(--serif); font-size: 20px; color: var(--ink3); font-weight: 500; }
.hero-txt { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-bottom: 4px; }
.verdict { font-family: var(--serif); font-weight: 700; font-size: 20px; line-height: 1.15; }
.hero-sub { color: var(--ink2); font-size: 14.5px; }
.gauge { width: 100%; height: auto; margin-top: 22px; overflow: visible; }
.gauge .tk { stroke: var(--line); stroke-width: 2; }
.gauge .tk.lit { stroke: var(--ink); }
.gauge text { font-family: var(--serif); font-size: 11px; fill: var(--ink3); }
.gauge .zn.bad { fill: var(--alert); } .gauge .zn.warn { fill: var(--amber); } .gauge .zn.ok { fill: var(--ink3); } .gauge .zn.good { fill: var(--good); }
.gauge .zn { opacity: .55; }
.gauge .prev { fill: var(--ink3); }
.gauge .needle { fill: var(--teal); stroke: var(--ink); stroke-width: 1.5; }
.gauge .needle.play { animation: sweep 1.1s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes sweep { from { transform: translateX(12px); } }
.gauge-note { font-size: 12.5px; color: var(--ink3); margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 48px; margin-top: 8px; }
.nextrow { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-top: 26px; padding: 14px 16px; border-radius: var(--r); background: var(--paper2); border: 1px solid var(--line); font-size: 14px; }
.nextrow p { flex: 1 1 260px; }

.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 28px 0 6px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.sec-h h2 { font-size: 17px; }
.sec-h span { font-size: 12.5px; color: var(--ink3); }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.pill .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--amber-soft); color: var(--amber-ink); }
.pill.bad { background: var(--alert-soft); color: var(--alert); }
.pill.mute { background: var(--paper2); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--line); }
.pill.teal { background: var(--teal-soft); color: var(--teal-ink); }

/* показатели */
.vitals { list-style: none; margin: 0; padding: 0; }
.vitals li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.vitals li:first-child { border-top: 0; }
.vitals .nm { font-weight: 500; }
.vitals .val { font-family: var(--serif); font-weight: 700; font-size: 20px; text-align: right; line-height: 1.2; }
.vitals .rng { grid-column: 1 / -1; margin-top: 8px; }
.vitals .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink3); margin-top: 6px; gap: 8px; }
.rng { position: relative; height: 6px; background: var(--paper2); border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.rng .band { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--ink3) 0 2px, transparent 2px 5px); opacity: .45; }
.rng .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--ink); border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--line); }
.rng .dot.warn { background: var(--amber); }
.rng .dot.bad { background: var(--alert); }
.rng .dot.good { background: var(--good); }

/* потери */
.losses { list-style: none; margin: 0; padding: 0; }
.losses li { padding: 14px 0; border-top: 1px solid var(--line); }
.losses li:first-child { border-top: 0; }
.losses .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.losses .amt { font-weight: 700; white-space: nowrap; }
.losses .bar { height: 6px; border-radius: 3px; background: var(--paper2); margin-top: 8px; overflow: hidden; }
.losses .bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink); }
.losses .why { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--ink); padding-top: 12px; margin-top: 4px; }
.total b { font-family: var(--serif); font-size: 24px; font-weight: 700; }
.fine { font-size: 12px; color: var(--ink3); margin-top: 8px; }

/* кнопки */
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--paper)); }
.btn.ghost { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--paper2); }
.btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* мастер диагностики */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
.steps div { font-size: 12px; color: var(--ink3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps div i { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 6px; }
.steps div.done i { background: var(--ink); }
.steps div.cur i { background: var(--teal); }
.steps div.cur { color: var(--ink); font-weight: 600; }
.q { padding: 14px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q label { display: block; font-weight: 500; margin-bottom: 2px; }
.q .hint { font-size: 12.5px; color: var(--ink3); margin-bottom: 8px; }
.field { display: flex; align-items: center; border-radius: 12px; background: var(--paper2); box-shadow: inset 0 0 0 1px var(--line); padding: 0 14px; }
.field:focus-within { box-shadow: inset 0 0 0 2px var(--ink); }
.field input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px 0; font-family: var(--serif); font-weight: 700; font-size: 18px; outline: none; }
.field span { color: var(--ink3); font-size: 13.5px; padding-left: 8px; }
.live { margin-top: 14px; padding: 12px 14px; background: var(--teal-soft); color: var(--ink); border-radius: 12px; font-size: 13.5px; }
.wizfoot { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.wizfoot .btn.primary { flex: 1; }
.disc { font-size: 12px; color: var(--ink3); margin-top: 16px; }
.calc ul { margin: 18px 0 0; padding: 0; }
.calc li { list-style: none; display: flex; gap: 10px; align-items: center; padding: 12px 0; color: var(--ink3); border-top: 1px solid var(--line); }
.calc li.on { color: var(--ink); }
.calc li .ic { color: var(--good); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: sp .8s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
.how { margin-top: 18px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); }
.how summary { padding: 12px 14px; font-weight: 500; cursor: pointer; }
.how .f { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.how .f small { display: block; color: var(--ink3); }
.how .f code { font-family: var(--serif); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11px; border-radius: 6px; padding: 1px 7px; font-weight: 600; letter-spacing: .02em; }
.tag.calc-t { background: var(--paper2); color: var(--ink2); box-shadow: inset 0 0 0 1px var(--line); }
.tag.ai-t { background: var(--teal-soft); color: var(--teal-ink); }

/* графики */
.mt { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px; scrollbar-width: none; }
.mt::-webkit-scrollbar { display: none; }
.mt button { flex: none; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); border-radius: 99px; padding: 7px 14px; font-size: 13.5px; color: var(--ink2); }
.mt button[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.chart { position: relative; max-width: 760px; }
.chart svg { width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; transform: translate(-50%, -100%); white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 3; }
.chart .tip b { font-family: var(--serif); font-size: 15px; display: block; }
.chart text { font-family: var(--serif); font-size: 11px; fill: var(--ink3); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .nb { fill: var(--good); opacity: .12; }
.chart .nbl { fill: var(--good); font-size: 11px; }
.chart .pt { fill: var(--teal); stroke: var(--ink); stroke-width: 2; }
.chart .cross { stroke: var(--ink3); stroke-dasharray: 3 3; }
.chart .endlab { fill: var(--ink); font-weight: 700; font-size: 14px; }

.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 500; color: var(--ink3); font-size: 12px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.r, .tbl th.r { text-align: right; padding-right: 0; }
.tbl .d.up { color: var(--good); font-weight: 600; }
.tbl .d.dn { color: var(--alert); font-weight: 600; }

/* назначения */
.recs { list-style: none; margin: 0; padding: 0; }
.rec { border-top: 1px solid var(--line); }
.rec:first-child { border-top: 0; }
.rec > button { width: 100%; text-align: left; background: none; border: 0; padding: 16px 0; display: grid; grid-template-columns: 28px 1fr auto; gap: 0 12px; align-items: start; }
.rec .n { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.25; color: var(--ink3); }
.rec .tt { font-weight: 600; line-height: 1.35; }
.rec .sub { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink2); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rec .amt { font-family: var(--serif); font-weight: 700; white-space: nowrap; }
.rec .body { padding: 0 0 18px 40px; font-size: 14px; }
.rec .body ul { margin: 6px 0 12px; padding-left: 18px; color: var(--ink2); }
.rec .ai { background: var(--teal-soft); border-radius: 12px; padding: 10px 12px; margin: 10px 0 12px; font-size: 13.5px; }
.rec .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* чат */
.mgr { display: flex; gap: 12px; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); max-width: 720px; }
.av { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--serif); font-weight: 700; flex: none; }
.av.sm { width: 34px; height: 34px; font-size: 12.5px; }
.msgs { display: flex; flex-direction: column; gap: 8px; padding: 16px 0; max-width: 720px; }
.m { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; }
.m.in { background: var(--paper2); box-shadow: inset 0 0 0 1px var(--line); border-bottom-left-radius: 6px; align-self: flex-start; }
.m.out { background: var(--ink); color: var(--paper); border-bottom-right-radius: 6px; align-self: flex-end; }
.m time { display: block; font-size: 10.5px; opacity: .6; margin-top: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; max-width: 720px; }
.chip { border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); border-radius: 99px; padding: 7px 12px; font-size: 13px; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.compose { display: flex; gap: 8px; max-width: 720px; }
.compose input { flex: 1; min-width: 0; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper2); border-radius: 12px; padding: 12px 14px; outline: none; }
.compose input:focus { box-shadow: inset 0 0 0 2px var(--ink); }

/* листы и уведомления */
.sheetbg { position: fixed; inset: 0; background: rgba(15,17,19,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet { background: var(--paper); width: 100%; border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 90vh; max-height: 90dvh; overflow-y: auto; animation: rise .22s cubic-bezier(.2, .8, .2, 1); }
.sheet h2 { font-size: 22px; margin-bottom: 6px; }
.sheet .kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sheet .kv span:first-child { color: var(--ink2); }
.sheet .kv span:last-child { text-align: right; }
.sheet.more .grp { margin-top: 14px; }
.sheet.more .grp > p { padding-left: 0; }
.sheet.more .nav { padding-left: 0; padding-right: 0; }
.sheet.more .nav[aria-current="page"] { box-shadow: none; background: none; font-weight: 600; }
.sheet.more .nav[aria-current="page"]::before { left: -18px; }
.sheet.more .btn { margin-top: 18px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0; font-size: 14px; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--ink); flex: none; }
.lock { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--paper2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink2); font-size: 13.5px; margin: 14px 0; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; background: var(--ink); color: var(--paper); padding: 12px 14px; border-radius: 12px; font-size: 14px; z-index: 50; display: flex; gap: 8px; align-items: center; animation: rise .2s ease-out; box-shadow: var(--shadow); }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.replist { margin: 6px 0 12px; padding: 0; list-style: none; }
.replist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.replist li b { white-space: nowrap; }
.sheet .score .big { font-size: 52px; }

/* ---------- компании ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 22px; overflow: hidden; }
.kpis > div { padding: 14px 16px; min-width: 0; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.kpis > div:nth-child(odd) { border-left: 0; }
.kpis > div:nth-child(-n+2) { border-top: 0; }
.kpis small { color: var(--ink3); font-size: 12.5px; display: block; }

function lineChart(id, o) {
  const W = 354, H = 210, L = 36, R = 44, T = 18, B = 28;
  const vs = o.vals, n = vs.length;
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (o.band) { lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
  const pad = (hi - lo) * .15 || 2; lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const X = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, lo + (hi - lo) / 2, hi].map(t => Math.round(t));
  let g = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R + 8}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`).join('');
  if (o.band) g += `<rect class="nb" x="${L}" y="${Y(o.band[1])}" width="${W - L - R + 8}" height="${Y(o.band[0]) - Y(o.band[1])}" rx="4"/><text class="nbl" x="${L + 6}" y="${Y(o.band[1]) + 13}">норма</text>`;
  const d = vs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const lx = o.labels.map((l, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`).join('');
  const last = n - 1;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}${lx}
    <path class="line" d="${d}"/>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/>
    <circle class="pt" cx="${X(last)}" cy="${Y(vs[last])}" r="5.5"/>
    <text class="endlab" x="${X(last) + 10}" y="${Y(vs[last]) + 5}">${o.fmt(vs[last])}</text>
    <circle class="pt hov" r="5.5" style="display:none"/>
    <rect x="${L - 10}" y="0" width="${W - L - R + 24}" height="${H}" fill="transparent" data-hit/>
  </svg><div class="tip"></div></div>`;
}
function wireChart(id, o) {
  const root = document.getElementById(id); if (!root) return;
  const svg = root.querySelector('svg'), tip = root.querySelector('.tip'), cross = root.querySelector('.cross'), hov = root.querySelector('.hov');
  const W = 354, H = 210, L = 36, R = 44, T = 18, B = 28, n = o.vals.length;
  let lo = Math.min(...o.vals), hi = Math.max(...o.vals);
  if (o.band) { lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
  const pad = (hi - lo) * .15 || 2; lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const X = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  function move(e) {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    let k = Math.round((px - L) / (W - L - R) * (n - 1)); k = clamp(k, 0, n - 1);
    cross.setAttribute('x1', X(k)); cross.setAttribute('x2', X(k)); cross.style.display = '';
    hov.setAttribute('cx', X(k)); hov.setAttribute('cy', Y(o.vals[k])); hov.style.display = '';
    tip.innerHTML = `<b class="num">${o.fmt(o.vals[k])}</b>${o.labels[k]}`;
    tip.style.left = (X(k) / W * r.width) + 'px'; tip.style.top = (Y(o.vals[k]) / H * r.height - 12) + 'px'; tip.style.opacity = 1;
  }
  function leave() { cross.style.display = 'none'; hov.style.display = 'none'; tip.style.opacity = 0; }
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
}

function aTariffs() {

    ${[['Цена в месяц', '4 900 ₽', '9 900 ₽', '19 900 ₽'], ['Диагностика', 'раз в месяц', 'раз в месяц', 'раз в месяц'], ['История и динамика', '3 месяца', '12 месяцев', 'без ограничений'], ['Сравнение периодов', '—', 'да', 'да'], ['Менеджер', 'по запросу', 'закреплённый', 'закреплённый + разбор'], ['Типы бизнеса', '1', '1', 'до 3'], ['HR и анализ команды', '—', '—', 'да'], ['Клиентов на тарифе', '31', '58', '19']].map(r => `<tr><td><b>${r[0]}</b></td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- каркас и события ---------- */
const VIEWS = { home: vHome, diag: vDiag, dyn: vDyn, recs: vRecs, chat: vMgr, cos: () => S.mgr.sel ? mDetail() : mList(), modules: aModules, users: aUsers, assign: aCompanies, tariffs: aTariffs };
function navItem(n) { return `<button class="nav" data-act="tab" data-v="${n[0]}" ${S.tab === n[0] ? 'aria-current="page"' : ''}>${ic(n[2])}<span>${n[1]}</span></button>`; }
function pageHead() {
  if (S.tab === 'home') return `<header class="ph"><p class="eyebrow">Автосервис «Мотор-Юг» · ${cur().month}</p><h1>Состояние бизнеса</h1></header>`;
  if (S.tab === 'cos' && S.mgr.sel) return '';
  const t = TITLES[S.tab];
  return `<header class="ph"><p class="eyebrow">${t[0]}</p><h1>${t[1]}</h1>${t[2] ? `<p class="lead">${t[2]}</p>` : ''}</header>`;
}
function crumb() {
  const g = NAV.find(x => x[1].some(n => n[0] === S.tab)), n = NAV_ALL.find(x => x[0] === S.tab);
  const sub = S.tab === 'cos' && S.mgr.sel ? ' · ' + COS.find(x => x.id === S.mgr.sel).name : '';
  return `${g[0]} <i>/</i> <b>${n[1]}</b>${esc(sub)}`;
}
function shell() {
  const inMore = !TABBAR.some(t => t[0] === S.tab);
  return `<div class="app">
    <aside class="side" aria-label="Разделы"><div class="brand">${ic('mark', 'mark')}<span>Чек-ап</span></div>
      <button class="co-card" data-act="profile"><span class="av sm">МЮ</span><span><b>Мотор-Юг</b><small>Тариф «Рост»</small></span></button>
      ${NAV.map(g => `<div class="grp"><p>${g[0]}</p>${g[1].map(navItem).join('')}</div>`).join('')}
      <div class="side-foot"><a href="story.html" target="_blank" rel="noopener">Схема работы</a><span>Данные хранятся в России</span></div></aside>
    <div class="content">
      <header class="top"><div class="top-l"><span class="brand m">${ic('mark', 'mark')}<span>Чек-ап</span></span><span class="crumb">${crumb()}</span></div>
        <div class="top-r"><button class="iconbtn" data-act="theme" aria-label="Сменить тему">${ic(isDark() ? 'sun' : 'moon')}</button><button class="avatarbtn" data-act="profile" aria-label="Профиль компании">АР</button></div></header>
      <main class="page" id="page">${pageHead()}${VIEWS[S.tab]()}</main></div>
    <nav class="tabbar" aria-label="Разделы">${TABBAR.map(t => `<button data-act="${t[0] === 'more' ? 'more' : 'tab'}" data-v="${t[0]}" ${(t[0] === S.tab || (t[0] === 'more' && inMore)) ? 'aria-current="page"' : ''}>${ic(t[2])}<span>${t[1]}</span></button>`).join('')}</nav>
    ${sheetHTML()}</div>`;
}
function isDark() { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function render() {
  const key = S.tab + (S.mgr.sel || '');
  $('#app').innerHTML = shell();
  if (S.tab === 'chat') window.scrollTo(0, document.body.scrollHeight); else if (render.key !== key) window.scrollTo(0, 0);
  render.key = key;
  if (S.tab === 'dyn') { const s = series(S.mt); wireChart('ch1', { vals: s.vals, labels: s.labels, fmt: s.fmt, band: s.band }); }
  if (S.tab === 'cos' && S.mgr.sel) { const c = coView(COS.find(x => x.id === S.mgr.sel)); const h = c.h.map(Math.round); wireChart('ch2', { vals: h, labels: HIST.labels.slice(0, h.length > 6 ? 6 : h.length).concat(h.length > 6 ? ['Окт'] : []), fmt: v => String(Math.round(v)) }); }
  const ms = $('#msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
}
function toast(t) {
  const host = document.body; $$('.toast').forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = ic('check') + esc(t); host.appendChild(el); setTimeout(() => el.remove(), 2600);
}
const now = () => 'сегодня, ' + new Date(2026, 9, 24, 19, 30 + S.chat.length).toTimeString().slice(0, 5);
function reply(t, delay) { setTimeout(() => { S.chat.push({ w: 'in', t, time: now() }); if (S.tab === 'chat') render(); }, delay || 1100); }
function startCalc() {
  S.stage = 'calc'; S.calcStep = 0; render();
  const tick = () => { S.calcStep++; if (S.calcStep > 4) { S.done = true; S.stage = 'result'; S.mt = 'idx'; render(); return; } render(); setTimeout(tick, 650); };
  setTimeout(tick, 650);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (t.matches('.sheetbg') && e.target.closest('[data-stop]')) return;
  if (a === 'send' || a === 'msend' || a === 'mreply') return;
  switch (a) {
    case 'theme': { const d = !isDark(); document.documentElement.dataset.theme = d ? 'dark' : 'light'; S.sheet = null; render(); break; }
    case 'tab': S.tab = v; S.sheet = null; if (v === 'cos') S.mgr.sel = null; if (v === 'diag' && S.done && S.stage === 'wiz') S.stage = 'result'; history.replaceState(null, '', '#' + v); render(); break;
    case 'more': S.sheet = 'more'; render(); break;
    case 'profile': S.sheet = 'profile'; render(); break;
    case 'report': S.sheet = 'report'; render(); break;
    case 'remind': S.remind = v; render(); toast('Напоминание: ' + REMIND[v][0].toLowerCase()); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'opencons': S.sheet = 'consent'; render(); break;
    case 'consent': S.consent = true; render(); break;
    case 'next': if (S.step < 3) { S.step++; render(); } else startCalc(); break;
    case 'prev': S.step = Math.max(0, S.step - 1); render(); break;
    case 'redo': S.stage = 'wiz'; S.step = 0; render(); break;
    case 'mt': S.mt = v; render(); break;
    case 'rf': S.recFilter = v; render(); break;
    case 'rec': S.openRec = S.openRec === v ? null : v; render(); break;
    case 'rst': { const c = S.recSt[v]; S.recSt[v] = c === 'new' ? 'work' : c === 'work' ? 'done' : 'work'; toast(c === 'new' ? 'Назначение в работе' : c === 'work' ? 'Назначение выполнено' : 'Назначение возвращено в работу'); render(); break; }
    case 'discuss': { const r = RECS.find(x => x.id === v); S.chat.push({ w: 'out', t: 'Хочу обсудить: ' + r.t, time: now() }); S.tab = 'chat'; render(); reply('Сейчас посмотрю, что стоит за этим пунктом, и напишу вам.'); break; }
    case 'slot': S.slot = v; S.chat.push({ w: 'out', t: 'Запишите меня на разбор: ' + v, time: now() }); render(); reply('Записала на ' + v + '. Ссылку на видеозвонок пришлю за час до встречи.'); toast('Вы записаны: ' + v); break;
    case 'quick': S.chat.push({ w: 'out', t: v, time: now() }); render(); reply(v.startsWith('Как') ? 'Откройте вкладку «Диагностика»: четыре шага, пять минут. Цифры можно взять из учётной системы за последний месяц.' : 'В тарифе «Рост» ежемесячная диагностика, история за 12 месяцев, сравнение периодов и закреплённый менеджер.'); break;
    case 'mfilter': S.mgr.filter = v; render(); break;
    case 'mopen': S.mgr.sel = v; render(); window.scrollTo(0, 0); break;
    case 'mback': S.mgr.sel = null; render(); break;
    case 'abiz': S.adm.biz = v; render(); break;
    case 'toast': toast(v); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act="mopen"]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, a = f.dataset.act; const inp = $('input', f); const txt = inp.value.trim(); if (!txt) return;
  if (a === 'send') { S.chat.push({ w: 'out', t: txt, time: now() }); render(); reply('Принято, посмотрю ваши цифры и отвечу сегодня.'); }
  if (a === 'mreply') { S.chat.push({ w: 'in', t: txt, time: now() }); render(); toast('Сообщение отправлено клиенту'); }
  if (a === 'msend') { const id = f.dataset.v; (S.mgr.log[id] = S.mgr.log[id] || []).unshift(esc(txt)); if (id === 'motor') S.chat.push({ w: 'in', t: txt, time: now() }); render(); toast('Сообщение отправлено клиенту'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.k) {
    const raw = t.value.replace(/\D/g, ''), n = raw ? parseInt(raw, 10) : 0; S.inp[t.dataset.k] = n; t.value = raw ? nf.format(n).replace(/ /g, ' ') : '';
    const i = S.inp, v = vals(i), L = $('#live');
    if (L) L.innerHTML = [
      `Валовая маржа <b class="num">${pc(v.margin)}</b>, операционная <b class="num">${pc(v.op)}</b>`,
      `Средний чек <b class="num">${rub(i.rev / (i.orders || 1))}</b>, повторных <b class="num">${pc(v.repeat)}</b>`,
      `Загрузка постов <b class="num">${pc(v.util)}</b> (мощность ${nf.format(i.posts * i.hoursPost)} ч)`,
      `Текучесть <b class="num">${pc(v.churn)}</b> за 12 месяцев`][S.step];
  }
  if (t.id === 'cons') $('#consbtn').disabled = !t.checked;
  if (t.dataset.w) { S.adm.weights[t.dataset.w] = +t.value; const wn = weights(); METRICS.forEach(m => { const el = $('#wl-' + m.id); if (el) el.textContent = Math.round(wn[m.id] * 100) + '%'; }); const pv = $('#pv'); if (pv) pv.textContent = Math.round(index(vals(S.done ? S.inp : SEPT))); }
  if (t.dataset.note) S.mgr.note[t.dataset.note] = t.value;
});
document.addEventListener('change', e => { if (e.target.dataset.cm != null) toast('Менеджер изменён, записано в журнал'); if (e.target.dataset.ur != null) { S.adm.users[+e.target.dataset.ur].r = e.target.value; toast('Роль изменена, записано в журнал'); } });

const h = location.hash.slice(1), OLD = { client: 'home', manager: 'cos', admin: 'modules' };
if (VIEWS[h]) S.tab = h; else if (OLD[h]) S.tab = OLD[h];
if (h === 'first') { S.consent = false; S.done = false; S.stage = 'wiz'; S.chat[0].t = 'Андрей, добрый день! Диагностика за сентябрь готова: индекс вырос до 62. Октябрь проходите до 28-го, я проверю цифры до разбора.'; }
window.__S = S;
let lastCompact = compact();
addEventListener('resize', () => { if (compact() !== lastCompact) { lastCompact = compact(); render(); } });
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = 'light';
render();
})();
</script>
</body></html>
