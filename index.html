/* Дизайн-план.
   Образ: медицинский чек-ап для бизнеса. Индекс здоровья, жизненные показатели с границами нормы,
   назначения вместо абстрактных советов. Одна смелая деталь: пульс-линия под индексом.
   Палитра «Бирюза и чернила»: бумага, чернила, бирюза, янтарь. Шрифты: Literata (заголовки и цифры), Golos Text (интерфейс).
   Композиция: лист-карточка пациента с тонкими линиями, без ряда одинаковых карточек. */
:root {
  --bg: #EDEDF2;
  --paper: #FFFFFF;
  --paper2: #F5F5F9;
  --ink: #17171F;
  --ink2: #5B5B6B;
  --ink3: #9494A3;
  --line: #E4E4EC;
  --teal: #6247F0;
  --teal-ink: #4B33CC;
  --teal-soft: #ECE9FF;
  --amber: #E39B1B;
  --amber-soft: #FFF1D6;
  --amber-ink: #8A5A00;
  --alert: #D8453A;
  --alert-soft: #FDE6E3;
  --good: #1F9D61;
  --good-soft: #DFF5E9;
  --shadow: 0 1px 0 rgba(23,23,31,.04), 0 18px 48px -20px rgba(23,23,31,.22);
  --r: 14px;
  --serif: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101016;
    --paper: #1A1A23;
    --paper2: #22222D;
    --ink: #F2F2F7;
    --ink2: #B0B0C0;
    --ink3: #7C7C8C;
    --line: #2E2E3A;
    --teal: #8C77FF;
    --teal-ink: #B3A4FF;
    --teal-soft: #2A2447;
    --amber: #F0B040;
    --amber-soft: #3A2E12;
    --amber-ink: #F0B040;
    --alert: #F0766B;
    --alert-soft: #43201C;
    --good: #4CC98B;
    --good-soft: #143627;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 20px 48px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101016;
  --paper: #1A1A23;
  --paper2: #22222D;
  --ink: #F2F2F7;
  --ink2: #B0B0C0;
  --ink3: #7C7C8C;
  --line: #2E2E3A;
  --teal: #8C77FF;
  --teal-ink: #B3A4FF;
  --teal-soft: #2A2447;
  --amber: #F0B040;
  --amber-soft: #3A2E12;
  --amber-ink: #F0B040;
  --alert: #F0766B;
  --alert-soft: #43201C;
  --good: #4CC98B;
  --good-soft: #143627;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 20px 48px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 28px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; text-wrap: balance; letter-spacing: -.02em; }
.num { font-variant-numeric: tabular-nums lining-nums; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- demo bar ---------- */
.demobar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  max-width: 1180px; margin: 0 auto; padding: 12px 0;
  background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 600; font-size: 17px; }
.brand .mark { width: 26px; height: 26px; color: var(--teal); }
.storylink { color: var(--teal-ink); font-weight: 500; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; font-size: 14px; }
.brand small { font-family: var(--sans); font-weight: 500; font-size: 12px; color: var(--ink2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.seg { display: inline-flex; background: var(--paper2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-weight: 500; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--paper2); border-radius: 12px; color: var(--ink2); }
.bar-right { display: flex; gap: 8px; align-items: center; }

/* ---------- stage ---------- */
.stage { max-width: 1180px; margin: 8px auto 0; display: grid; grid-template-columns: 430px; justify-content: center; align-items: start; }
.aside { display: none; }
.aside h3 { font-size: 22px; line-height: 1.2; margin-bottom: 10px; }
.aside p { color: var(--ink2); }
.aside .why { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; }
.aside .why b { display: block; font-size: 12px; letter-spacing: .06em; color: var(--teal-ink); margin-bottom: 4px; }

.phone {
  width: 430px; height: min(860px, calc(100dvh - 88px)); min-height: 600px; background: var(--paper); border: 1px solid var(--line);
  border-radius: 38px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.tghead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 16px 10px; font-size: 13px; color: var(--ink2); border-bottom: 1px solid var(--line); background: var(--paper); }
.tghead .t { font-weight: 600; color: var(--ink); text-align: center; line-height: 1.15; }
.tghead .t small { display: block; font-weight: 400; color: var(--ink3); font-size: 11px; }
.tghead .l { justify-self: start; display: flex; align-items: center; gap: 4px; color: var(--teal-ink); }
.tghead .r { justify-self: end; }
.avatarbtn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--teal-soft); color: var(--teal-ink); font-weight: 600; font-size: 12px; display: grid; place-items: center; }
.scr { flex: 1; overflow-y: auto; padding: 18px 18px 24px; scrollbar-width: thin; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--paper); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; padding: 6px 0; color: var(--ink3); }
.tabs button[aria-current="page"] { color: var(--teal-ink); font-weight: 600; }

.eyebrow { font-size: 13px; color: var(--ink2); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 8px; }
.sec-h h2 { font-size: 18px; }
.sec-h span { font-size: 12.5px; color: var(--ink3); }
.rule { border-top: 1px solid var(--line); }

/* hero index */
.hero { position: relative; padding: 4px 0 6px; }
.hero .co { font-size: 13px; color: var(--ink2); }
.score { display: flex; align-items: flex-end; gap: 10px; margin-top: 10px; }
.score .big { font-family: var(--serif); font-weight: 600; font-size: 88px; line-height: .86; letter-spacing: -.04em; }
.score { flex-wrap: wrap; }
.score .of { font-size: 15px; color: var(--ink3); padding-bottom: 6px; white-space: nowrap; }
.score .delta { margin-left: auto; align-self: flex-start; }
.pulse { margin: 8px -18px 0; color: var(--teal); }
.pulse svg { width: 100%; height: auto; }
.pulse path { stroke-dasharray: 1; stroke-dashoffset: 0; }
.pulse.play path { animation: trace 1.8s ease-out both; }
@keyframes trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.verdict { margin-top: 4px; font-size: 14.5px; }
.verdict b { font-weight: 600; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.pill .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--amber-soft); color: var(--amber-ink); }
.pill.bad { background: var(--alert-soft); color: var(--alert); }
.pill.mute { background: var(--paper2); color: var(--ink2); border: 1px solid var(--line); }

function lineChart(id, o) {
  const W = 354, H = 210, L = 36, R = 44, T = 18, B = 28;
  const vs = o.vals, n = vs.length;
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if (o.band) { lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
  const pad = (hi - lo) * .15 || 2; lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const X = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, lo + (hi - lo) / 2, hi].map(t => Math.round(t));
  let g = ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R + 8}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`).join('');
  if (o.band) g += `<rect class="nb" x="${L}" y="${Y(o.band[1])}" width="${W - L - R + 8}" height="${Y(o.band[0]) - Y(o.band[1])}" rx="4"/><text class="nbl" x="${L + 6}" y="${Y(o.band[1]) + 13}">норма</text>`;
  const d = vs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
  const lx = o.labels.map((l, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`).join('');
  const last = n - 1;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}${lx}
    <path class="line" d="${d}"/>
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/>
    <circle class="pt" cx="${X(last)}" cy="${Y(vs[last])}" r="5.5"/>
    <text class="endlab" x="${X(last) + 10}" y="${Y(vs[last]) + 5}">${o.fmt(vs[last])}</text>
    <circle class="pt hov" r="5.5" style="display:none"/>
    <rect x="${L - 10}" y="0" width="${W - L - R + 24}" height="${H}" fill="transparent" data-hit/>
  </svg><div class="tip"></div></div>`;
}
function wireChart(id, o) {
  const root = document.getElementById(id); if (!root) return;
  const svg = root.querySelector('svg'), tip = root.querySelector('.tip'), cross = root.querySelector('.cross'), hov = root.querySelector('.hov');
  const W = 354, H = 210, L = 36, R = 44, T = 18, B = 28, n = o.vals.length;
  let lo = Math.min(...o.vals), hi = Math.max(...o.vals);
  if (o.band) { lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
  const pad = (hi - lo) * .15 || 2; lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const X = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  function move(e) {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    let k = Math.round((px - L) / (W - L - R) * (n - 1)); k = clamp(k, 0, n - 1);
    cross.setAttribute('x1', X(k)); cross.setAttribute('x2', X(k)); cross.style.display = '';
    hov.setAttribute('cx', X(k)); hov.setAttribute('cy', Y(o.vals[k])); hov.style.display = '';
    tip.innerHTML = `<b class="num">${o.fmt(o.vals[k])}</b>${o.labels[k]}`;
    tip.style.left = (X(k) / W * r.width) + 'px'; tip.style.top = (Y(o.vals[k]) / H * r.height - 12) + 'px'; tip.style.opacity = 1;
  }
  function leave() { cross.style.display = 'none'; hov.style.display = 'none'; tip.style.opacity = 0; }
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move); svg.addEventListener('pointerleave', leave);
}

  if (a === 'msend') { const id = f.dataset.v; (S.mgr.log[id] = S.mgr.log[id] || []).unshift(esc(txt)); if (id === 'motor') S.chat.push({ w: 'in', t: txt, time: now() }); render(); toast('Сообщение отправлено клиенту'); }

  if (t.dataset.note) S.mgr.note[t.dataset.note] = t.value;
});
document.addEventListener('change', e => { if (e.target.dataset.cm != null) toast('Менеджер изменён, записано в журнал'); if (e.target.dataset.ur != null) { S.adm.users[+e.target.dataset.ur].r = e.target.value; toast('Роль изменена, записано в журнал'); } });

const h = location.hash.slice(1); if (['client', 'manager', 'admin'].includes(h)) S.role = h;
if (h === 'first') { S.consent = false; S.done = false; S.stage = 'wiz'; S.chat[0].t = 'Андрей, добрый день! Диагностика за сентябрь готова: индекс вырос до 62. Октябрь проходите до 28-го, я проверю цифры до разбора.'; }
window.__S = S;
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = 'light';
